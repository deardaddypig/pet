<script>
  // 禁右
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 禁F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的他媽哥治 - 進化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fbcfe8;
            background-image: radial-gradient(#f472b6 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            touch-action: manipulation;
            user-select: none;
        }

        /* --- UI 樣式 --- */
        .game-btn {
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            box-shadow: 0 4px 0 #00000033;
        }
        .game-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00000033;
        }
        .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: 0 2px 0 #00000033;
            transform: translateY(2px);
            filter: grayscale(100%);
        }
        .screen-shadow { box-shadow: inset 0 0 15px rgba(0,0,0,0.25); }
        .stat-bar { transition: width 0.3s ease, background-color 0.3s ease; }

        /* --- 房間/公園背景 --- */
        .room-wall {
            background-color: #fef08a; 
            height: 65%; width: 100%; position: absolute; top: 0;
            transition: background-color 1s, filter 1s;
            border-bottom: 4px solid #d97706;
        }
        .room-floor {
            background-color: #fcd34d;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.05) 20px, rgba(0,0,0,0.05) 22px);
            height: 35%; width: 100%; position: absolute; bottom: 0;
            transition: background-color 1s, filter 1s;
        }
        .window {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 58px; height: 58px; background: #bae6fd;
            border: 4px solid white; border-radius: 6px;
            transition: background-color 1s;
        }
        .window::before { content: ''; position: absolute; background: white; width: 100%; height: 4px; top: 50%; left: 0; transform: translateY(-50%); }
        .window::after { content: ''; position: absolute; background: white; width: 4px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }

        /* --- 寵物容器 --- */
        #pet-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            transition: left 1s ease-in-out, bottom 1s ease-in-out;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        
        .flip-wrapper { transition: transform 0.3s; }
        .is-flipped { transform: scaleX(-1); }

        @keyframes breathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.95) translateY(3px); }
        }
        .pet-idle { animation: breathe 2s infinite ease-in-out; }

        .is-eating #beak-bottom { animation: chew 0.25s infinite; }
        @keyframes chew {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px) scaleY(1.5); }
        }

        .is-playing #wing-l { animation: flap-l 0.2s infinite alternate; }
        .is-playing #wing-r { animation: flap-r 0.2s infinite alternate; }
        .is-playing .pet-idle { animation: happy-bounce 0.4s infinite alternate !important; }

        @keyframes flap-l { 0% { transform: rotate(0deg); } 100% { transform: rotate(40deg); } }
        @keyframes flap-r { 0% { transform: rotate(0deg); } 100% { transform: rotate(-40deg); } }
        @keyframes happy-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }

        /* 愛心與摸摸特效 */
        @keyframes float-heart {
            0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
            100% { transform: translate(-50%, -45px) scale(1.3); opacity: 0; }
        }
        .heart-bubble {
            position: absolute;
            animation: float-heart 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 40;
        }

        /* 蒼蠅與小夥伴動畫 */
        @keyframes buzz {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(30px, -40px) scale(1.2) rotate(15deg); }
            50% { transform: translate(-20px, -20px) scale(0.9) rotate(-10deg); }
            75% { transform: translate(-40px, -60px) scale(1.1) rotate(20deg); }
            100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        }
        .fly-anim { animation: buzz 4s infinite ease-in-out alternate; pointer-events: none; }
        .poop-anim { animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes dropIn { from { transform: translateY(-20px) scale(0); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        @keyframes friend-run {
            0% { transform: translateX(0) scaleX(-1); }
            45% { transform: translateX(-90px) scaleX(-1); }
            50% { transform: translateX(-90px) scaleX(1); }
            95% { transform: translateX(0) scaleX(1); }
            100% { transform: translateX(0) scaleX(-1); }
        }
        .friend-anim { animation: friend-run 4.5s infinite linear; }
        .friend-bounce { animation: happy-bounce 0.3s infinite alternate; }

        /* SVG 狀態 */
        #eyes g, #pet-svg .cheek, #pet-svg .ghost-tail, #evo-crown, #evo-shades, #evo-halo { display: none; }
        #pet-svg[data-state="idle"] #eye-idle { display: block; }
        #pet-svg[data-state="happy"] #eye-happy, #pet-svg[data-state="happy"] .cheek { display: block; }
        #pet-svg[data-state="eating"] #eye-happy, #pet-svg[data-state="eating"] .cheek { display: block; }
        #pet-svg[data-state="playing"] #eye-happy, #pet-svg[data-state="playing"] .cheek { display: block; }
        #pet-svg[data-state="sleep"] #eye-sleep { display: block; }
        #pet-svg[data-state="sad"] #eye-sad { display: block; }
        #pet-svg[data-state="sick"] #eye-sad { display: block; }
        
        #pet-svg[data-state="dead"] #eye-dead, #pet-svg[data-state="dead"] .ghost-tail { display: block; }
        #pet-svg .body-color { fill: #FCE928; transition: fill 0.5s; }
        #pet-svg[data-state="dead"] .body-color { fill: #cbd5e1; } 
        #pet-svg[data-state="sick"] .body-color { fill: #d9f99d; } 
        #pet-svg[data-state="dead"] .legs { display: none; } 

        /* 進化裝飾顯示 */
        #pet-svg[data-evo="crown"] #evo-crown { display: block; }
        #pet-svg[data-evo="shades"] #evo-shades { display: block; }
        #pet-svg[data-evo="halo"] #evo-halo { display: block; }
        
        /* 幼年期體型 */
        #pet-svg[data-stage="baby"] { transform: scale(0.78); }
    </style>
</head>

    <script>
        /* ========================================================
           1. 8-Bit Web Audio 合成音效系統
           ======================================================== */
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playSound('click');
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now); osc.stop(now + 0.05);
                }
                else if (type === 'eat') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now); osc.stop(now + 0.12);
                }
                else if (type === 'happy' || type === 'pet') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (i * 0.07));
                        gain.gain.setValueAtTime(0.12, now + (i * 0.07));
                        gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.07) + 0.12);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + (i * 0.07)); osc.stop(now + (i * 0.07) + 0.12);
                    });
                }
                else if (type === 'slide') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.5);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now); osc.stop(now + 0.5);
                }
                else if (type === 'hurt') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now); osc.stop(now + 0.3);
                }
                else if (type === 'evolve') {
                    [440, 554, 659, 880].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.12));
                        gain.gain.setValueAtTime(0.15, now + (idx * 0.12));
                        gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.12) + 0.25);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + (idx * 0.12)); osc.stop(now + (idx * 0.12) + 0.25);
                    });
                }
            } catch(e) {}
        }

        /* ========================================================
           2. 核心遊戲常數與狀態
           ======================================================== */
        const MAX_STAT = 100;
        const TICK_RATE = 1000;
        const SAVE_KEY = 'TAMAGOTCHI_DATA_V2';

        let stats = { hunger: 100, happiness: 100, health: 100, sleep: 100 };
        let isDead = false;
        let isInteracting = false;
        let sleepingMode = false;
        let isAskingToPlay = false;
        let isOutside = false;

        // 成長與進化變數
        let ageSeconds = 0;
        let totalOutdoorTrips = 0;
        let evolutionStage = 'baby'; // 'baby' | 'child' | 'adult'
        let evolutionType = 'none';  // 'none' | 'crown' | 'shades' | 'halo'

        // 紀念品清單
        let collectedSouvenirs = [];
        const SOUVENIR_POOL = [
            { id: 'flower', icon: '🌸', name: '野花' },
            { id: 'acorn', icon: '🌰', name: '松果' },
            { id: 'coin', icon: '🪙', name: '幸運幣' },
            { id: 'clover', icon: '🍀', name: '四葉草' },
            { id: 'balloon', icon: '🎈', name: '小氣球' },
            { id: 'shell', icon: '🐚', name: '公園貝殼' }
        ];

        let gameLoop, walkLoop, autoSaveLoop;
        let poopTimers = []; 
        let interactionTimeout = null;
        let sleepTimer = null;

        // DOM 元素
        const domBars = {
            hunger: document.getElementById('bar-hunger'),
            happiness: document.getElementById('bar-happiness'),
            health: document.getElementById('bar-health'),
            sleep: document.getElementById('bar-sleep')
        };
        const petContainer = document.getElementById('pet-container');
        const petFlipWrapper = document.getElementById('pet-flip-wrapper');
        const petSvg = document.getElementById('pet-svg');
        const statusMsgEl = document.getElementById('status-message');
        const askDialogEl = document.getElementById('ask-dialog');
        const roomWall = document.getElementById('room-wall');
        const roomFloor = document.getElementById('room-floor');
        const roomArea = document.getElementById('room-area');
        const roomMess = document.getElementById('room-mess');
        const souvenirShelfEl = document.getElementById('souvenir-shelf');
        const petInfoFormEl = document.getElementById('pet-info-form');
        const petInfoAgeEl = document.getElementById('pet-info-age');
        const gameOverScreen = document.getElementById('game-over-screen');
        const deathReasonEl = document.getElementById('death-reason');
        const buttons = document.querySelectorAll('.game-btn');

        /* ========================================================
           3. 存檔與離線成長機制 (LocalStorage)
           ======================================================== */
        function saveGame() {
            if (isDead) return;
            const data = {
                stats,
                ageSeconds,
                totalOutdoorTrips,
                evolutionStage,
                evolutionType,
                collectedSouvenirs,
                lastSavedTime: Date.now()
            };
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadGame() {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;
            try {
                const data = JSON.parse(raw);
                stats = data.stats || stats;
                ageSeconds = data.ageSeconds || 0;
                totalOutdoorTrips = data.totalOutdoorTrips || 0;
                evolutionStage = data.evolutionStage || 'baby';
                evolutionType = data.evolutionType || 'none';
                collectedSouvenirs = data.collectedSouvenirs || [];

                // 結算離線時間衰減 (每離開 60 秒扣除約 1 點飢餓和心情)
                const elapsedSeconds = Math.floor((Date.now() - (data.lastSavedTime || Date.now())) / 1000);
                if (elapsedSeconds > 10) {
                    const decay = Math.min(60, Math.floor(elapsedSeconds / 60)); // 上限扣 60 點，防止直接餓死
                    stats.hunger = Math.max(10, stats.hunger - decay);
                    stats.happiness = Math.max(10, stats.happiness - decay);
                    stats.sleep = Math.min(100, stats.sleep + Math.floor(decay * 1.5));
                    
                    const awayMins = Math.floor(elapsedSeconds / 60);
                    setTimeout(() => {
                        updateStatusMessage(`你走開咗 ${awayMins} 分鐘，好掛住你！`);
                    }, 800);
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        /* ========================================================
           4. 摸摸小寵物互動
           ======================================================== */
        function petPet() {
            if (isDead || isOutside || sleepingMode) return;
            playSound('pet');

            // 飄動愛心
            const heart = document.createElement('div');
            heart.className = 'heart-bubble text-2xl';
            heart.textContent = Math.random() < 0.5 ? '❤️' : '💕';
            heart.style.left = '50%';
            heart.style.top = '-10px';
            petContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 800);

            // 增加少許開心度
            stats.happiness = Math.min(100, stats.happiness + 3);
            updateUI();
            updateStatusMessage("嘻嘻，好舒服～ 💕");

            // 輕微跳躍
            petFlipWrapper.style.transform = 'translateY(-10px)';
            setTimeout(() => {
                petFlipWrapper.style.transform = 'translateY(0)';
            }, 200);
        }

        /* ========================================================
           5. 成長與進化系統
           ======================================================== */
        function checkEvolution() {
            // 年齡計算：每 60 秒為 1 歲
            const petAgeYears = Math.floor(ageSeconds / 60);
            const petMinutes = Math.floor(ageSeconds / 60);
            petInfoAgeEl.textContent = `${petAgeYears} 歲 (${Math.floor(ageSeconds % 60)}秒)`;

            // 形態判斷 (1分鐘後進階到幼童，3分鐘後成年進化)
            if (evolutionStage === 'baby' && ageSeconds >= 60) {
                evolutionStage = 'child';
                triggerEvolution('🐥 活潑小雞', 'none', "✨ 小雞長大咗喇！變成活潑小雞！");
            } 
            else if (evolutionStage === 'child' && ageSeconds >= 180) {
                evolutionStage = 'adult';
                // 根據性格條件分歧進化
                if (totalOutdoorTrips >= 2) {
                    evolutionType = 'crown';
                    triggerEvolution('👑 國王小雞', 'crown', "👑 經常探索公園，進化成國王小雞！");
                } else if (stats.health >= 85) {
                    evolutionType = 'shades';
                    triggerEvolution('🕶️ 型男雞', 'shades', "🕶️ 體格強健！進化成型男雞！");
                } else {
                    evolutionType = 'halo';
                    triggerEvolution('😇 甜夢神雞', 'halo', "😇 乖巧溫順！進化成甜夢神雞！");
                }
            }

            applyEvolutionVisuals();
        }

        function triggerEvolution(title, evoType, message) {
            playSound('evolve');
            updateStatusMessage(message);
            // 慶祝閃爍特效
            petSvg.style.filter = 'drop-shadow(0 0 10px gold)';
            setTimeout(() => { petSvg.style.filter = 'none'; }, 2500);
        }

        function applyEvolutionVisuals() {
            petSvg.setAttribute('data-stage', evolutionStage);
            petSvg.setAttribute('data-evo', evolutionType);

            let formName = '🐣 幼年小雞';
            if (evolutionStage === 'child') formName = '🐥 活潑小雞';
            if (evolutionStage === 'adult') {
                if (evolutionType === 'crown') formName = '👑 國王小雞';
                else if (evolutionType === 'shades') formName = '🕶️ 型男雞';
                else if (evolutionType === 'halo') formName = '😇 甜夢神雞';
            }
            petInfoFormEl.textContent = formName;
        }

        /* ========================================================
           6. 紀念品收藏展示系統
           ======================================================== */
        function renderSouvenirs() {
            if (collectedSouvenirs.length === 0) {
                souvenirShelfEl.innerHTML = '<span class="text-amber-200 text-[10px]">未有</span>';
                return;
            }
            souvenirShelfEl.innerHTML = '';
            collectedSouvenirs.forEach(item => {
                const s = document.createElement('span');
                s.textContent = item.icon;
                s.title = item.name;
                s.className = 'cursor-pointer hover:scale-125 transition-transform';
                s.onclick = (e) => {
                    e.stopPropagation();
                    updateStatusMessage(`紀念品: ${item.name} ${item.icon}`);
                };
                souvenirShelfEl.appendChild(s);
            });
        }

        function tryGiveSouvenir() {
            // 45% 機率找到紀念品
            if (Math.random() < 0.45) {
                const available = SOUVENIR_POOL.filter(p => !collectedSouvenirs.some(c => c.id === p.id));
                if (available.length > 0) {
                    const picked = available[Math.floor(Math.random() * available.length)];
                    collectedSouvenirs.push(picked);
                    renderSouvenirs();
                    saveGame();
                    return picked;
                }
            }
            return null;
        }

        /* ========================================================
           7. 遊戲主流程與動作控制
           ======================================================== */
        function updateStatusMessage(msg) {
            if (!statusMsgEl) return;
            statusMsgEl.textContent = msg;
            statusMsgEl.style.transform = 'scale(1.05)';
            setTimeout(() => {
                if (statusMsgEl) statusMsgEl.style.transform = 'scale(1)';
            }, 150);
        }

        function startGame() {
            clearInterval(gameLoop);
            clearInterval(walkLoop);
            clearInterval(autoSaveLoop);
            clearTimeout(interactionTimeout);
            clearTimeout(sleepTimer);
            poopTimers.forEach(timer => clearTimeout(timer));
            poopTimers = [];

            document.querySelectorAll('.poop-item, .fly-item, .temp-item, .zzz-particle, .park-friend').forEach(el => el.remove());

            const hasLoaded = loadGame();
            if (!hasLoaded) {
                stats = { hunger: 100, happiness: 100, health: 100, sleep: 100 };
                ageSeconds = 0;
                totalOutdoorTrips = 0;
                evolutionStage = 'baby';
                evolutionType = 'none';
                collectedSouvenirs = [];
            }

            isDead = false;
            isInteracting = false;
            sleepingMode = false;
            isAskingToPlay = false;
            isOutside = false;
            
            petSvg.setAttribute('data-state', 'idle');
            petSvg.classList.remove('is-eating', 'is-playing');
            petSvg.style.transform = 'none';
            
            switchToHomeScene();
            applyEvolutionVisuals();
            renderSouvenirs();

            askDialogEl.classList.add('hidden');
            statusMsgEl.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            
            petContainer.style.transition = 'left 1s ease-in-out, bottom 1s ease-in-out';
            petContainer.style.left = '50%';
            petContainer.style.bottom = '20px';
            petFlipWrapper.classList.remove('is-flipped');
            document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '睡覺';
            
            buttons.forEach(btn => btn.disabled = false);
            updateUI();
            
            gameLoop = setInterval(tick, TICK_RATE);
            walkLoop = setInterval(randomWalk, 3000);
            autoSaveLoop = setInterval(saveGame, 4000);
        }

        function tick() {
            if (isDead) return;

            // 增加存活時間與檢驗進化
            ageSeconds++;
            checkEvolution();

            if (sleepingMode) {
                stats.sleep += 10;
                stats.hunger -= 0.5;
                if (stats.sleep >= MAX_STAT) wakeUp();
            } else {
                stats.hunger -= 1.2;
                stats.happiness -= 1.2;
                stats.sleep -= 0.6;
                if (stats.hunger < 30 || stats.sleep < 30 || stats.happiness < 30) stats.health -= 1.5;
            }

            // 蒼蠅懲罰 (只限室內)
            if (!isOutside) {
                const flyCount = document.querySelectorAll('.fly-item').length;
                if (flyCount > 0) {
                    stats.health -= (flyCount * 1.5);
                    if (!sleepingMode && !isInteracting && !isAskingToPlay && Math.random() < 0.25) {
                        updateStatusMessage("嗡嗡嗡... 好嘈 🪰");
                    }
                }
            }

            // 大便生成
            if (!isOutside && !sleepingMode && stats.hunger >= 90 && Math.random() < 0.15) {
                spawnPoop();
            }

            // 隨機要求去公園
            if (!sleepingMode && !isInteracting && !isOutside && !isAskingToPlay && stats.happiness > 30 && stats.health > 30) {
                if (Math.random() < 0.02) promptGoOutside();
            }

            clampStats();
            updateUI();
            checkState();
        }

        function clampStats() {
            for (let key in stats) {
                if (stats[key] > MAX_STAT) stats[key] = MAX_STAT;
                if (stats[key] < 0) stats[key] = 0;
            }
        }

        function randomWalk() {
            if (isDead || isInteracting || sleepingMode || isAskingToPlay || isOutside) return;
            if (Math.random() < 0.25) return; 

            const minX = 15; 
            const maxX = 85; 
            const newLeft = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            walkTo(newLeft, () => {}, `${Math.floor(Math.random() * 8) + 18}px`);
        }

        function walkTo(targetPercent, callback, customBottom = '20px', delay = 800) {
            const currentLeft = parseFloat(petContainer.style.left) || 50;
            if (targetPercent < currentLeft) petFlipWrapper.classList.add('is-flipped');
            else petFlipWrapper.classList.remove('is-flipped');

            petContainer.style.left = `${targetPercent}%`;
            petContainer.style.bottom = customBottom;

            interactionTimeout = setTimeout(callback, delay);
        }

        /* 動作互動 */
        function interact(action) {
            if (isDead || isOutside) return;
            playSound('click');

            if (isAskingToPlay) {
                isAskingToPlay = false;
                askDialogEl.classList.add('hidden');
                statusMsgEl.classList.remove('hidden');
            }

            if (sleepingMode && action !== 'sleep') {
                updateStatusMessage("噓... 正在睡覺");
                return;
            }

            isInteracting = true;
            clearTimeout(interactionTimeout);

            if (action === 'feed') {
                updateStatusMessage("好好味！");
                playSound('eat');
                spawnTempItem('🍔', 40);
                walkTo(45, () => {
                    if (isDead) return;
                    petSvg.setAttribute('data-state', 'eating');
                    petSvg.classList.add('is-eating');
                    stats.hunger += 35;
                    interactionTimeout = setTimeout(() => { petSvg.classList.remove('is-eating'); endInteraction(); }, 2000);
                });
            } 
            else if (action === 'play') {
                updateStatusMessage("太好玩了！");
                playSound('happy');
                spawnTempItem('⚽', 65);
                walkTo(55, () => {
                    if (isDead) return;
                    petSvg.setAttribute('data-state', 'playing');
                    petSvg.classList.add('is-playing');
                    stats.happiness += 35; stats.sleep -= 5; stats.hunger -= 5;
                    interactionTimeout = setTimeout(() => { petSvg.classList.remove('is-playing'); endInteraction(); }, 2000);
                });
            }
            else if (action === 'heal') {
                if (stats.health >= 90) { updateStatusMessage("我很健康喔！"); isInteracting = false; return; }
                stats.health += 45;
                petSvg.setAttribute('data-state', 'idle');
                updateStatusMessage("食完藥藥，好返好多！✨");
                playSound('happy');
                interactionTimeout = setTimeout(endInteraction, 1500);
            }
            else if (action === 'clean') {
                cleanRoom();
                updateStatusMessage("房間變乾淨了！✨");
                stats.happiness += 10;
                interactionTimeout = setTimeout(endInteraction, 1000);
            }
            else if (action === 'sleep') {
                if (sleepingMode) wakeUp(); else goSleep();
            }
        }

        function spawnTempItem(emoji, leftPercent) {
            const item = document.createElement('div');
            item.textContent = emoji;
            item.className = 'temp-item absolute text-4xl z-10 transition-opacity duration-300 drop-shadow-md';
            item.style.left = `${leftPercent}%`;
            item.style.bottom = '20px';
            roomArea.appendChild(item);
        }

        function endInteraction() {
            document.querySelectorAll('.temp-item').forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            });
            if (!isDead) {
                isInteracting = false;
                clampStats(); updateUI(); checkState();
            }
        }

        /* 公園外出流程 */
        function promptGoOutside() {
            isAskingToPlay = true;
            statusMsgEl.classList.add('hidden');
            askDialogEl.classList.remove('hidden');
            playSound('happy');
        }

        function answerOutside(agreed) {
            isAskingToPlay = false;
            askDialogEl.classList.add('hidden');
            statusMsgEl.classList.remove('hidden');
            playSound('click');

            if (agreed) startOutsidePlay();
            else updateStatusMessage("好吧...下次再去 😔");
        }

        function startOutsidePlay() {
            isInteracting = true;
            isOutside = true;
            totalOutdoorTrips++;
            updateStatusMessage("耶！出發去公園！🎈");
            
            walkTo(130, () => {
                switchToParkScene();
                
                petContainer.style.transition = 'none';
                petContainer.style.left = '-30%';
                petContainer.style.bottom = '20px';
                void petContainer.offsetWidth; 
                
                petContainer.style.transition = 'left 1.4s ease-in-out, bottom 1.4s ease-in-out';
                walkTo(35, () => {
                    if (Math.random() < 0.75) {
                        spawnFriend();
                        updateStatusMessage("遇見新朋友一齊玩！🌟");
                    } else {
                        updateStatusMessage("公園空氣好清新呀！🌲");
                    }
                    setTimeout(parkStep1_Slide, 1800);
                }, '20px', 1400);
            }, '20px', 1200);
        }

        function parkStep1_Slide() {
            updateStatusMessage("等我去玩滑梯先！🛝");
            petSvg.setAttribute('data-state', 'happy');
            
            walkTo(8, () => {
                petContainer.style.transition = 'left 0.9s linear, bottom 0.9s linear';
                walkTo(8, () => {
                    updateStatusMessage("準備——溜落去！💨");
                    petSvg.setAttribute('data-state', 'playing');
                    petSvg.classList.add('is-playing');
                    playSound('slide');
                    
                    petContainer.style.transition = 'left 0.7s cubic-bezier(0.5, 0, 0.7, 0.6), bottom 0.7s cubic-bezier(0.5, 0, 0.7, 0.6)';
                    walkTo(42, () => {
                        updateStatusMessage("呼！好刺激！😆");
                        petContainer.style.transition = 'left 1s ease-in-out, bottom 1s ease-in-out';
                        setTimeout(parkStep2_RunAround, 1200);
                    }, '20px', 800);
                }, '88px', 1000);
            }, '20px', 900);
        }

        function parkStep2_RunAround() {
            updateStatusMessage("跑跑跳跳好舒服！🏃‍♂️");
            petSvg.setAttribute('data-state', 'playing');
            petSvg.classList.add('is-playing');

            walkTo(75, () => {
                walkTo(20, () => {
                    walkTo(50, () => {
                        petSvg.classList.remove('is-playing');
                        setTimeout(finishOutsidePlay, 1000);
                    }, '20px', 1400);
                }, '20px', 1400);
            }, '20px', 1400);
        }

        function spawnFriend() {
            const friends = ['🐶', '🐱', '🐰', '🐹', '🐥', '🦊', '🐼'];
            const friendEmoji = friends[Math.floor(Math.random() * friends.length)];
            
            const wrapper = document.createElement('div');
            wrapper.className = 'park-friend absolute z-10 friend-anim';
            wrapper.style.left = '78%';
            wrapper.style.bottom = '20px';
            
            const inner = document.createElement('div');
            inner.className = 'friend-bounce text-[38px] drop-shadow-md';
            inner.textContent = friendEmoji;
            
            wrapper.appendChild(inner);
            roomArea.appendChild(wrapper);
        }

        function finishOutsidePlay() {
            // 5% 機率受傷
            const isInjured = Math.random() < 0.05;
            let foundItem = null;

            if (isInjured) {
                stats.health = Math.max(0, stats.health - 25);
                stats.happiness = Math.max(0, stats.happiness - 10);
                updateStatusMessage("嗚嗚... 唔小心跌親整傷咗 🤕");
                playSound('hurt');
                petSvg.setAttribute('data-state', 'sick');
            } else {
                stats.happiness = Math.min(100, stats.happiness + 50); 
                stats.sleep = Math.max(0, stats.sleep - 15); 
                playSound('happy');

                // 嘗試尋寶
                foundItem = tryGiveSouvenir();
                if (foundItem) {
                    updateStatusMessage(`喺草地搵到 ${foundItem.icon} ${foundItem.name}！帶返屋企收藏～`);
                } else {
                    updateStatusMessage("玩得好滿足！差唔多要返屋企囉 🏠");
                }
                petSvg.setAttribute('data-state', 'happy');
            }
            updateUI();
            saveGame();

            setTimeout(() => {
                walkTo(-30, () => {
                    switchToHomeScene();
                    document.querySelectorAll('.park-friend').forEach(el => el.remove());
                    
                    petContainer.style.transition = 'none';
                    petContainer.style.left = '130%';
                    void petContainer.offsetWidth;
                    
                    setTimeout(() => {
                        petContainer.style.transition = 'left 1.2s ease-in-out, bottom 1.2s ease-in-out';
                        walkTo(50, () => {
                            isInteracting = false;
                            isOutside = false;
                            checkState();
                        }, '20px', 1200);
                    }, 100);
                }, '20px', 1400);
            }, foundItem ? 3000 : 2200);
        }

        function switchToParkScene() {
            document.getElementById('indoor-decor').classList.add('hidden');
            document.getElementById('indoor-carpet').classList.add('hidden');
            document.getElementById('outdoor-decor').classList.remove('hidden');
            roomMess.classList.add('hidden');
            
            roomWall.style.backgroundColor = '#7dd3fc'; 
            roomWall.style.borderBottom = '4px solid #16a34a'; 
            roomFloor.style.backgroundColor = '#86efac'; 
        }

        function switchToHomeScene() {
            document.getElementById('indoor-decor').classList.remove('hidden');
            document.getElementById('indoor-carpet').classList.remove('hidden');
            document.getElementById('outdoor-decor').classList.add('hidden');
            roomMess.classList.remove('hidden');
            
            roomWall.style.backgroundColor = '#fef08a';
            roomWall.style.borderBottom = '4px solid #d97706'; 
            roomFloor.style.backgroundColor = '#fcd34d'; 
            
            if (sleepingMode) { 
                roomWall.style.backgroundColor = '#1e293b'; 
                roomFloor.style.backgroundColor = '#334155';
                roomWall.style.borderBottom = '4px solid #0f172a';
            }
        }

        /* 便便與睡眠 */
        function spawnPoop() {
            const poop = document.createElement('div');
            poop.textContent = '💩';
            poop.className = 'poop-item absolute text-2xl z-0 poop-anim drop-shadow-sm pointer-events-auto';
            poop.style.left = petContainer.style.left || '50%';
            poop.style.bottom = `${Math.floor(Math.random() * 15) + 5}px`; 
            roomMess.appendChild(poop);

            const tId = setTimeout(() => {
                if (poop.parentNode && !isDead) spawnFly(poop.style.left, poop.style.bottom);
            }, 10000);
            poopTimers.push(tId);
        }

        function spawnFly(startX, startY) {
            const fly = document.createElement('div');
            fly.textContent = '🪰';
            fly.className = 'fly-item absolute text-xl z-20 fly-anim pointer-events-auto';
            fly.style.left = startX;
            fly.style.bottom = startY;
            roomMess.appendChild(fly);
        }

        function cleanRoom() {
            document.querySelectorAll('.poop-item, .fly-item').forEach(el => {
                el.style.transition = 'all 0.3s'; el.style.opacity = '0'; el.style.transform = 'scale(0.3)';
                setTimeout(() => el.remove(), 300);
            });
            poopTimers.forEach(timer => clearTimeout(timer));
            poopTimers = [];
        }

        function goSleep() {
            sleepingMode = true;
            walkTo(80, () => {
                if (isDead || !sleepingMode) return;
                petSvg.setAttribute('data-state', 'sleep');
                roomWall.style.backgroundColor = '#1e293b'; 
                document.querySelector('.window').style.background = '#0f172a'; 
                roomFloor.style.backgroundColor = '#334155';
                roomWall.style.borderBottom = '4px solid #0f172a';
                
                updateStatusMessage("呼嚕呼嚕...");
                document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '喚醒';
                spawnZzz();
                isInteracting = false;
            });
        }

        function spawnZzz() {
            if (!sleepingMode || isDead) return;
            const zzz = document.createElement('div');
            zzz.textContent = 'z';
            zzz.className = 'zzz-particle absolute font-black text-indigo-400 text-lg pointer-events-none';
            zzz.style.left = '65%'; zzz.style.top = '0px'; zzz.style.transform = 'translateY(-10px) scale(1)';
            zzz.style.opacity = '1'; zzz.style.transition = 'all 1.2s ease-out';
            
            petContainer.appendChild(zzz);

            requestAnimationFrame(() => {
                zzz.style.transform = 'translateY(-40px) scale(1.6)';
                zzz.style.opacity = '0';
            });
            setTimeout(() => zzz.remove(), 1200);

            clearTimeout(sleepTimer);
            if (sleepingMode && !isDead) sleepTimer = setTimeout(spawnZzz, 1200);
        }

        function wakeUp() {
            sleepingMode = false;
            clearTimeout(sleepTimer);
            document.querySelectorAll('.zzz-particle').forEach(el => el.remove());

            switchToHomeScene();
            document.querySelector('.window').style.background = '#bae6fd';
            document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '睡覺';
            
            petSvg.setAttribute('data-state', 'happy');
            updateStatusMessage("早晨！瞓飽好精神！✨");
            playSound('happy');
            walkTo(50, () => { isInteracting = false; checkState(); });
        }

        function updateUI() {
            for (let key in stats) {
                const val = stats[key];
                const bar = domBars[key];
                bar.style.width = `${val}%`;
                if (val > 50) bar.className = 'bg-green-500 h-2 rounded-full stat-bar';
                else if (val > 25) bar.className = 'bg-yellow-400 h-2 rounded-full stat-bar';
                else bar.className = 'bg-red-500 h-2 rounded-full stat-bar animate-pulse';
            }
        }

        function checkState() {
            if (isDead) return;

            if (stats.hunger <= 0) return die("餓死了 😭");
            if (stats.happiness <= 0) return die("憂鬱而死 💔");
            if (stats.health <= 0) return die("病死了 🤒 (房間太髒了?)");
            if (stats.sleep <= 0) return die("過勞猝死 😵");

            if (isInteracting || sleepingMode || isOutside || isAskingToPlay) return;

            let lowestKey = Object.keys(stats).reduce((a, b) => stats[a] < stats[b] ? a : b);
            let lowestVal = stats[lowestKey];

            if (lowestVal <= 30) {
                if (lowestKey === 'health') { petSvg.setAttribute('data-state', 'sick'); updateStatusMessage("咳咳..."); }
                else if (lowestKey === 'hunger') { petSvg.setAttribute('data-state', 'sad'); updateStatusMessage("肚仔好餓..."); }
                else if (lowestKey === 'sleep') { petSvg.setAttribute('data-state', 'sleep'); updateStatusMessage("好眼瞓喔..."); }
                else if (lowestKey === 'happiness') { petSvg.setAttribute('data-state', 'sad'); updateStatusMessage("好無聊..."); }
            } else if (stats.happiness >= 80 && stats.hunger >= 80) {
                petSvg.setAttribute('data-state', 'happy');
                updateStatusMessage("今天心情真好！");
            } else {
                petSvg.setAttribute('data-state', 'idle');
                if (Math.random() < 0.2) updateStatusMessage("發呆中...");
            }
        }

        function die(reason) {
            isDead = true;
            localStorage.removeItem(SAVE_KEY); // 死亡後清空存檔
            
            clearInterval(gameLoop); clearInterval(walkLoop); clearInterval(autoSaveLoop);
            clearTimeout(interactionTimeout); clearTimeout(sleepTimer);
            poopTimers.forEach(timer => clearTimeout(timer));
            buttons.forEach(btn => btn.disabled = true);
            
            playSound('hurt');
            petSvg.classList.remove('is-eating', 'is-playing', 'pet-idle');
            petSvg.setAttribute('data-state', 'dead');
            
            petSvg.style.transition = 'transform 2s ease-out';
            petSvg.style.transform = 'translateY(-40px)'; 
            
            roomWall.style.filter = 'grayscale(100%) brightness(50%)';
            roomFloor.style.filter = 'grayscale(100%) brightness(50%)';
            
            askDialogEl.classList.add('hidden');
            statusMsgEl.classList.remove('hidden');
            updateStatusMessage("......");

            setTimeout(() => {
                deathReasonEl.textContent = `原因: ${reason}`;
                gameOverScreen.classList.remove('hidden');
            }, 1500);
        }

        function restartGame() {
            localStorage.removeItem(SAVE_KEY);
            startGame();
        }

        window.onload = startGame;
    </script>
</body>
</html>
